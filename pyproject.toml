[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightline"
version = "0.1.0"
description = "Raspberry Pi camera display application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "PyYAML>=6.0",
    "opencv-python>=4.8",
]

[project.scripts]
nightline = "nightline.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
