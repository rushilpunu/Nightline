app:
  name: "Nightline"
  log_directory: "/tmp/nightline"
  show_fps: false

display:
  width: 480
  height: 320
  fullscreen: true

parking:
  provider: simulated
  units: cm
  update_hz: 10
  freshness_timeout_ms: 750
  caution_distance_cm: 80
  critical_distance_cm: 35
  hysteresis_cm: 5

camera:
  source: 0
  width: 640
  height: 480
  fps: 30
  reconnect_timing_ms: 5000
